name: harness-verify
on: pull_request
permissions:
  contents: read
concurrency:
  group: harness-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A fresh runner's first xcodebuild can see no simulators at all; listing them once loads them first.
      - name: Load simulators
        run: xcrun simctl list devices available
      - name: Unit tests
        run: xcodebuild -project App.xcodeproj -scheme App -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' -destination-timeout 180 -parallel-testing-enabled NO -only-testing:AppTests test
      # Runners have no SwiftLint: the base image's version, its published sha256 checked before it runs.
      - name: SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          export PATH="$RUNNER_TEMP/swiftlint:$PATH"
          swiftlint --strict
